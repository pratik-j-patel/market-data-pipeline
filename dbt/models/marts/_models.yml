# =============================================================================
# The marts layer.
#
# staging answers "is this data clean and correctly typed?". marts answers
# "what shape does this need to be in for someone to ask a question of it?".
# Those are different jobs and they are deliberately different folders, built
# into different schemas.
#
# The severity rule these tests follow is written out once, in
# models/staging/_models.yml. Short version: a broken grain is an error because
# this pipeline is wrong; a strange number is a warning because the provider is.
#
# ONE INVARIANT IS DELIBERATELY NOT TESTED TWICE.
#   dim_tickers carries trading_days and price_rows as separate columns
#   precisely so that a duplicate shows up as an inequality between them. It is
#   tempting to add a test asserting they are equal for every ticker -- and it
#   would be redundant, because price_rows exceeds trading_days if and only if
#   stg_prices holds a duplicate (ticker, trade_date), which is exactly what the
#   uniqueness test on stg_prices.price_key already fails on. Two tests for one
#   fault means two alerts, two investigations and one fix. The columns stay,
#   because they make the fault legible to a person reading the dimension; the
#   second test does not.
# =============================================================================

version: 2

models:
  - name: dim_tickers
    description: >
      One row per ticker: what the symbol is, who it belongs to, what sector it
      trades in, and how much price history the warehouse holds for it. Joins
      to any fact table on ticker. Type 1 -- an attribute change overwrites the
      row and no history is kept, which is honest for 25 large-caps whose
      sectors do not move.

    columns:
      - name: ticker
        description: >
          Exchange symbol. The grain and the natural key -- unique, stable, and
          used directly rather than behind a surrogate integer.
        data_tests:
          # The pair that makes the natural key defensible. Choosing a natural
          # key over a surrogate integer is a bet that the real-world value is
          # unique and always present; these two tests are what turn that bet
          # into something checked on every run rather than assumed in a
          # comment. Error on both -- if this fails, the dimension has stopped
          # being a dimension and the relationships test below is meaningless.
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: company_name
        description: >
          Display name from the seed. NULL means this ticker has price history
          but is missing from seeds/ticker_reference.csv -- a real gap, left
          visible on purpose.
        data_tests:
          # WARN. The full outer join in dim_tickers.sql exists so that a
          # ticker which trades but was never written down surfaces as a NULL
          # here instead of vanishing. This test is what turns that NULL from
          # something a person might notice into something dbt says out loud.
          # It is a warning because the fix is a line in a CSV, not a rebuild:
          # the prices are fine, only the label is missing.
          - not_null:
              config:
                severity: warn

      - name: sector
        description: >
          GICS sector from the seed. Eight distinct values across the current
          25 tickers. NULL carries the same meaning as a NULL company_name.
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: first_trade_date
        description: Earliest session the warehouse holds for this ticker.
        data_tests:
          # The mirror image of the company_name test, and the reason the join
          # is FULL OUTER rather than LEFT in either direction. NULL here means
          # a ticker is written down in the seed and has never traded -- which
          # in practice means either a typo in the symbol or a fetch that has
          # been quietly failing for that one ticker while the other 24 succeed
          # and the run exits zero.
          #
          # WARN, because 24 tickers of correct data should still reach the
          # dashboard while this is chased down.
          - not_null:
              config:
                severity: warn

      - name: last_trade_date
        description: Latest session the warehouse holds for this ticker.

      - name: trading_days
        description: >
          Distinct sessions held. The number grows by one each trading day, so it
          is not worth writing down here; what matters is that it is the same for
          every ticker. Anything less for one ticker is genuinely absent upstream,
          not dropped by this pipeline.

      - name: price_rows
        description: >
          Rows in stg_prices for this ticker. Should equal trading_days. If it
          does not, stg_prices holds a duplicate -- which is what the staging
          layer declines to hide, and what the uniqueness test on
          stg_prices.price_key fails on. This column is here to make that fault
          readable at a glance, not to be tested separately; see the note at
          the top of this file.

  - name: fct_daily_prices
    description: >
      One row per ticker per trading day: the session as traded, plus the five
      derived measures a price dashboard needs and the API does not send. Joins
      to dim_tickers on ticker. Carries no company or sector columns of its own,
      deliberately -- one join is cheaper than a sector correction that has to be
      made in two places.

    columns:
      - name: price_key
        description: >
          ticker and trade_date joined. The grain as one column, carried through
          from staging so the uniqueness test here works on a single column.
        data_tests:
          # Tested here as well as in staging, and that is not duplication of
          # the kind the note at the top of this file warns about. The staging
          # test asserts the LOAD is clean. This one asserts the TRANSFORM did
          # not introduce a duplicate of its own -- a join added later, a window
          # rewritten into a self-join. They can fail independently, and which
          # one fails tells you which half of the pipeline to look at.
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: ticker
        description: Exchange symbol. The join key into dim_tickers.
        data_tests:
          - not_null:
              config:
                severity: error
          # Referential integrity, which nothing in a warehouse enforces for
          # you. Snowflake accepts foreign key constraints and then does not
          # check them; this test is the check. It fails if the fact table holds
          # a ticker the dimension has never heard of, which is the state that
          # makes a dashboard's sector filter silently drop rows -- the join
          # finds no match, the row disappears from the chart, and no total
          # anywhere says it is missing.
          # `to` and `field` are ARGUMENTS to the test; `severity` is CONFIG.
          # At the top level those look identical, which is why dbt 1.10 moved
          # arguments under their own key and 1.12 warns on the old spelling.
          - relationships:
              arguments:
                to: ref('dim_tickers')
                field: ticker
              config:
                severity: error

      - name: trade_date
        description: The session this row covers.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: open
        description: First traded price of the session.
      - name: high
        description: Highest traded price of the session.
      - name: low
        description: Lowest traded price of the session.
      - name: close
        description: Last traded price of the session.
      - name: volume
        description: Shares traded. FLOAT, because 26% of values arrive fractional.
      - name: vwap
        description: Volume-weighted average price for the session.
      - name: transaction_count
        description: Number of individual trades in the session.
      - name: prior_close
        description: >
          The previous session's close for the same ticker. NULL on each ticker's
          first row -- correct, not missing: there is no earlier session to name.
          Deliberately untested for nulls: exactly 25 nulls is the expected
          state, and it is the binary evidence that `partition by ticker` is
          present in the window.
      - name: daily_return_pct
        description: >
          Percent change from prior_close. NULL wherever prior_close is NULL, and
          deliberately not coalesced to zero -- "nothing to compare against" and
          "did not move" are different claims. Unrounded; rounding is the
          dashboard's decision.
      - name: moving_avg_20d
        description: >
          Mean close over the trailing 20 trading sessions. NULL until 20 sessions
          exist for that ticker, rather than averaging however many are available
          and calling the result a 20-day average.
      - name: high_52w
        description: >
          Highest high over the trailing 252 sessions -- the conventional trading
          year. NULL until 252 sessions exist, which is roughly the first half of
          each ticker's history in this two-year dataset.
      - name: low_52w
        description: Lowest low over the same trailing 252 sessions, same NULL rule.
      - name: dollar_volume
        description: >
          Notional traded: vwap x volume, falling back to close x volume where the
          API omits vwap. The closest available measure of value changing hands.
      - name: loaded_at
        description: >
          When COPY INTO wrote the underlying raw row, UTC. Carried so a dashboard
          can show "data as of", and so the freshness question can be asked here
          without reaching back through staging.
